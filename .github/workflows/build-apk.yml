name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["web/**", "**.md"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.11 (buildPython de Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compilar APK (debug)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TelloControl.apk

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TelloControl-apk
          path: TelloControl.apk

      - name: Publicar release "apk-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "TelloControl APK (última compilación)"
          prerelease: true
          body: |
            APK de depuración compilada automáticamente desde `${{ github.ref_name }}` (commit `${{ github.sha }}`).

            **Instalación**: descarga `TelloControl.apk` en el móvil, ábrelo y acepta
            "instalar apps de origen desconocido" si Android lo pide.
          files: TelloControl.apk
